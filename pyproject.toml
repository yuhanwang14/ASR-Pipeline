[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transcription-pipeline"
version = "0.1.0"
description = "Local GPU-accelerated speech transcription with speaker diarization and LLM post-processing"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "yuhanwang14"}]
keywords = ["speech", "transcription", "asr", "diarization", "speaker", "gpu", "chinese", "english"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    # Audio processing
    "torch>=2.0",
    "torchaudio>=2.0",

    # VAD
    "silero-vad>=5.0",

    # Speaker diarization
    "pyannote.audio>=3.1",

    # ASR (vLLM backend is primary)
    "qwen-asr[vllm]",
    "vllm>=0.14",

    # LLM inference (JamePeng fork for Qwen3.5 hybrid architecture support)
    "llama-cpp-python>=0.3.31",

    # Utilities
    "pyyaml",
    "numpy",
    "scipy",
    "huggingface-hub",
]

[project.urls]
Homepage = "https://github.com/yuhanwang14/ASR-Pipeline"
Repository = "https://github.com/yuhanwang14/ASR-Pipeline"
Issues = "https://github.com/yuhanwang14/ASR-Pipeline/issues"

[project.optional-dependencies]
minimal = [
    "qwen-asr",  # Without vLLM extra
]
flash-attn = [
    "flash-attn>=2.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff>=0.1.0",
    "pytest-mock",
    "jiwer>=3.0",
]

[tool.uv.sources]
llama-cpp-python = { url = "https://github.com/JamePeng/llama-cpp-python/releases/download/v0.3.31-cu128-Basic-linux-20260306/llama_cpp_python-0.3.31+cu128.basic-cp313-cp313-linux_x86_64.whl" }

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".venv",
    "__pycache__",
    "build",
    "dist",
    ".git",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "C901",   # function complexity (some pipeline functions are inherently complex)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"
markers = [
    "integration: integration tests requiring external services",
    "gpu: tests requiring CUDA GPU",
]
