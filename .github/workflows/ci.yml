name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v2
        with:
          args: "check src/ tests/ scripts/"
      - uses: astral-sh/ruff-action@v2
        with:
          args: "format --check src/ tests/ scripts/"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies (CPU-only, no GPU packages)
        run: |
          pip install --upgrade pip
          pip install pytest pytest-cov pytest-mock jiwer
          pip install pyyaml numpy scipy soundfile
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -e . --no-deps
      - name: Run unit tests
        run: pytest tests/ -v -k "not integration and not gpu" --tb=short
